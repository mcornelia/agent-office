name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest -v test_server.py test_desktop_status.py test_communications.py test_job_board.py desktop/test_agent_office_ctl.py
      - run: python -m unittest discover -s manager -p 'test_*.py' -v
      - run: python -m unittest discover -s prototypes/keyboard-selection -p 'test_*.py' -v
      - name: Check generated page
        run: |
          python build_view.py
          git diff --exit-code -- index.html
