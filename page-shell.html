<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agent Office — local task activity</title>
  <style>
    body { margin:0; padding:20px; background:light-dark(#edece6,#17201a); color:light-dark(#263a32,#eef1e8); font-family:system-ui,sans-serif; }
    main { max-width:1120px; margin:0 auto; }
    .connection-note { max-width:1120px; margin:12px auto 0; font-size:13px; line-height:1.5; color:light-dark(#59695e,#bdcabc); }
    html[data-presentation="true"] body { padding:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:#101712; }
    html[data-presentation="true"] main { width:min(100vw,1180px); max-width:none; }
    html[data-presentation="true"] #agent-office .office-bottom,
    html[data-presentation="true"] #agent-office .job-hub,
    html[data-presentation="true"] .connection-note { display:none; }
    html[data-presentation="true"] #agent-office .office-window { border-radius:0; box-shadow:none; }
    @media(max-width:490px) { body { padding:8px; } }
    /* Hide example dispatch while the first live snapshot is loading. */
    #agent-office .task-input, #agent-office .send-task { display:none; }
  </style>
</head>
<body>
  <main><!--AGENT_OFFICE--></main>
  <p class="connection-note">Live task activity from this Mac. The OPEN sign glows while an agent is working; amber desks need your input or approval. <span id="local-watch-note"></span></p>
  <script>
    (() => {
      const office=document.getElementById('agent-office');
      const presentation=window.location.pathname==='/presentation';
      document.documentElement.dataset.presentation=String(presentation);
      if(presentation) document.title='Agent Office — presentation';
      office.agentOffice.applySnapshot({connected:false,slots:[]});
      let pollTimer=null, activeRequest=null, suspended=false;
      function showDisconnected() {
        office.agentOffice.applySnapshot({connected:false,slots:[]});
        document.getElementById('local-watch-note').textContent='';
      }
      async function refresh() {
        clearTimeout(pollTimer); pollTimer=null;
        if(suspended || document.hidden || activeRequest) return;
        // One request and one next-poll timer per visible page. A request owns
        // its result only until pause() aborts it; late results cannot repaint
        // a restored page or start a second polling loop.
        const request={controller:new AbortController(),timeout:null};
        activeRequest=request;
        request.timeout=setTimeout(()=>request.controller.abort(),4000);
        const current=()=>activeRequest===request && !suspended && !document.hidden;
        try {
          const response=await fetch(presentation?'/api/state?presentation=1':'/api/state',{cache:'no-store',signal:request.controller.signal});
          if(!response.ok) throw new Error('Activity source unavailable');
          const snapshot=await response.json();
          if(!current()) return;
          if(request.controller.signal.aborted) throw new Error('Activity request timed out');
          if(!snapshot || typeof snapshot.connected!=='boolean' || !Array.isArray(snapshot.slots)) throw new Error('Invalid activity snapshot');
          office.agentOffice.applySnapshot(snapshot);
          const watch=snapshot.managerWatch;
          const watchNote=document.getElementById('local-watch-note');
          const watchMessages={
            'state-limit':'Saved state is full—automatic dispatch is paused. Keep the saved receipts and ask for a review.',
            'paused-error':'Local manager watch needs attention—automatic rounds are paused.',
            'unavailable':'Local manager watch is waiting for reliable activity.',
            'configuration-changed':'Local manager watch configuration changed; automatic dispatch is stopped.',
            'disabled':'Local manager watch is disabled.',
            'manual-required':'Manual coordination—ask your coordinator for a check-in. No automatic prompts are sent.'
          };
          watchNote.textContent=!watch?'':watchMessages[watch.status] || (watch.continuityStatus==='recovery-needed'
            ?'Recovery needs your review—open the lead task and ask it to reconcile the saved job. No automatic recovery runs.'
            :'Local manager watch · idle checks use no AI.');
        } catch(_error) {
          if(current()) showDisconnected();
        } finally {
          clearTimeout(request.timeout);
          if(activeRequest===request) {
            activeRequest=null;
            if(!suspended && !document.hidden) pollTimer=setTimeout(refresh,1000);
          }
        }
      }
      function pause() {
        suspended=true;
        clearTimeout(pollTimer); pollTimer=null;
        const request=activeRequest; activeRequest=null;
        if(request) { clearTimeout(request.timeout); request.controller.abort(); }
      }
      function resume() {
        if(document.hidden) return;
        if(suspended) showDisconnected();
        suspended=false;
        refresh();
      }
      // Safari can restore this exact document from its back/forward cache.
      // These listeners must survive every hide/show cycle, not just the first.
      window.addEventListener('pagehide',pause);
      window.addEventListener('pageshow',resume);
      window.addEventListener('online',resume);
      document.addEventListener('visibilitychange',()=>document.hidden?pause():resume());
      resume();
    })();
  </script>
</body>
</html>
